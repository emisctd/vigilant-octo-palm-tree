on:
  workflow_dispatch:
    inputs:
      redirect_url:
        required: true
        type: string

      image_url:
        required: true
        type: string

      title:
        required: true
        type: string

      description:
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
- uses: actions/configure-pages@v5

- uses: actions/upload-pages-artifact@v4
  with:
    path: ./_site
- uses: actions/deploy-pages@v4
